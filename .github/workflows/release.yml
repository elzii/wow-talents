name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g. v1.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish macOS Release
    runs-on: macos-14 # Apple Silicon M1/arm64 runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          bun install --frozen-lockfile || bun install

      - name: Compile Tailwind CSS
        run: |
          bun run css

      - name: Build static assets
        run: |
          bun run static

      - name: Prepare Hutch & Cottontail environment
        run: |
          # Trigger initial devkit & core download
          npx electrobun build --help || true
          
          # Ensure Cottontail 0.5.0 directory has required binary symlink and stdlib
          COTTONTAIL_050=$(find ~/.hutch/releases/cottontail/0.5.0 -name macos-arm64 -type d 2>/dev/null | head -n 1)
          COTTONTAIL_071=$(find ~/.hutch/releases/cottontail/0.7.1 -name macos-arm64 -type d 2>/dev/null | head -n 1)
          if [ -n "$COTTONTAIL_050" ]; then
            mkdir -p "$COTTONTAIL_050/bin/cottontail-stdlib"
            if [ -f "$COTTONTAIL_050/bin/cottontail" ]; then
              ln -sf cottontail "$COTTONTAIL_050/bin/cottontail-core"
            fi
            if [ -n "$COTTONTAIL_071" ] && [ -d "$COTTONTAIL_071/bin/cottontail-stdlib" ]; then
              cp -r "$COTTONTAIL_071/bin/cottontail-stdlib"/* "$COTTONTAIL_050/bin/cottontail-stdlib/" || true
            fi
          fi

      - name: Package Electrobun stable app & generate OTA update assets
        run: |
          npx electrobun build --env=stable

      - name: Pre-extract application bundle for standalone distribution
        run: |
          ELECTROBUN_INSTALLER_UI_AUTOCLOSE=true "./build/stable-macos-arm64/WoW Talent Calculator.app/Contents/MacOS/launcher" --bootstrap-install || true
          rm -rf "./build/stable-macos-arm64/WoW Talent Calculator.app/Contents/MacOS/.cottontail-tmp"

      - name: Ad-hoc code sign application bundle and DMG
        run: |
          codesign --force --deep -s - "./build/stable-macos-arm64/WoW Talent Calculator.app"
          for dmg in artifacts/*.dmg build/stable-macos-arm64/*.dmg; do
            if [ -f "$dmg" ]; then
              echo "Signing disk image: $dmg"
              codesign --force -s - "$dmg"
            fi
          done

      - name: Create ZIP archive of application bundle
        run: |
          cd build/stable-macos-arm64
          ditto -c -k --keepParent "WoW Talent Calculator.app" "../../artifacts/WoWTalentCalculator-macos-arm64.zip"
          cd ../..

      - name: Verify build artifacts
        run: |
          echo "=== Generated Artifacts ==="
          ls -lh artifacts/
          echo "=== Stable Build Output ==="
          ls -lh build/stable-macos-arm64/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
